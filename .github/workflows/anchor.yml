name: anchor
on:
  push: { paths: ['programs/**', '.github/workflows/anchor.yml'] }
  pull_request: { paths: ['programs/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libudev-dev libssl-dev llvm libclang-dev protobuf-compiler
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Anchor 1.2.0
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          avm install 1.2.0 && avm use 1.2.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/target
          key: anchor-${{ runner.os }}-${{ hashFiles('programs/Cargo.lock') }}
      - name: Solana CLI wallet
        run: solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json
      - name: Test
        working-directory: programs
        run: |
          npm ci
          # --arch v1: matches the artifact deployed on devnet/localnet (see
          # programs/README.md). `-- --features test-clock` passes the cargo
          # feature that compiles in `set_test_clock` (see
          # programs/programs/sea_invaders/src/time.rs), which the harness
          # in programs/tests/helpers.ts needs to warp the on-chain clock;
          # `anchor test` starts its own solana-test-validator and runs
          # every file under programs/tests/ in one mocha process.
          # --validator legacy: this Anchor 1.2.0 build defaults to
          # starting `surfpool` instead, which isn't installed here (see
          # programs/README.md).
          anchor build --arch v1 -- --features test-clock
          anchor test --skip-build --validator legacy
