name: anchor
on:
  push: { paths: ['programs/**', '.github/workflows/anchor.yml'] }
  pull_request: { paths: ['programs/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libudev-dev libssl-dev llvm libclang-dev protobuf-compiler
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Anchor 1.2.0
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          avm install 1.2.0 && avm use 1.2.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/target
          key: anchor-${{ runner.os }}-${{ hashFiles('programs/Cargo.lock') }}
      - name: Test
        working-directory: programs
        run: |
          npm ci
          # --arch v1: litesvm 0.8.0 (pinned for @solana/web3.js v1 compatibility,
          # see programs/tests/helpers.ts) cannot load the SBPFv3 ELF that
          # `anchor build`'s default --arch v3 produces with this Anchor/Solana
          # toolchain combination, so the program must be built for the older,
          # widely-supported v1 architecture before the LiteSVM harness runs.
          anchor build --arch v1
          anchor test --skip-build
