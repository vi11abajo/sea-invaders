name: Deploy API to VPS

# Deploys only the backend (plus the core it depends on) to /var/www/sea-invaders-api,
# served as api.seainvaders.xyz. The legacy web game on the same server is not touched.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the core
        run: |
          cd core
          npm ci
          npm run build

      - name: Create the backend .env
        run: |
          cat > backend/.env << EOF
          NODE_ENV=production
          PORT=5439
          FRONTEND_URL=https://seainvaders.xyz
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=sea_invaders
          DB_USER=sea_invaders_user
          DB_PASSWORD=${{ secrets.API_DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          REDIS_ENABLED=false
          DAILY_SEED_SECRET=${{ secrets.DAILY_SEED_SECRET }}
          DAILY_FREE_ATTEMPTS=${{ secrets.DAILY_FREE_ATTEMPTS }}
          AUTH_DOMAIN=${{ secrets.AUTH_DOMAIN }}
          AUTH_URI=${{ secrets.AUTH_URI }}
          JUPITER_API_KEY=${{ secrets.JUPITER_API_KEY }}
          EOF

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          tar -czf deploy.tar.gz \
            --exclude='backend/node_modules' \
            --exclude='core/node_modules' \
            backend \
            core

          scp -P $SSH_PORT deploy.tar.gz $SSH_USER@$SSH_HOST:/tmp/sea-invaders-api.tar.gz

          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            mkdir -p /var/www/sea-invaders-api
            cd /var/www/sea-invaders-api

            if [ -d backend/src ]; then
              echo "Creating backup..."
              tar -czf ../sea-invaders-api-backup-$(date +%Y%m%d-%H%M%S).tar.gz backend/src backend/package.json core/dist
              ls -t ../sea-invaders-api-backup-*.tar.gz | tail -n +6 | xargs -r rm
            fi

            echo "Extracting new version..."
            tar -xzf /tmp/sea-invaders-api.tar.gz -C /var/www/sea-invaders-api
            rm /tmp/sea-invaders-api.tar.gz

            echo "Installing backend dependencies..."
            cd backend && npm ci --omit=dev --legacy-peer-deps && cd ..

            echo "Running migrations..."
            cd backend && npm run migrate && cd ..

            echo "Starting the API..."
            mkdir -p backend/logs
            pm2 startOrRestart backend/ecosystem.api.cjs --only sea-invaders-api
            pm2 save

            echo "Deployment completed!"
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting for the API to start..."
          sleep 15
          for i in {1..6}; do
            if curl -fsS https://api.seainvaders.xyz/health; then
              echo; echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/6 failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed"
          exit 1
