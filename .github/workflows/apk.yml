name: Build APK

# Builds the release APK for the Solana Seeker (arm64) on a GitHub runner, keeps it as a
# workflow artifact and copies it to the VPS (/root/apk) so it can be pulled from there.
# The app holds no secrets: every EXPO_PUBLIC_* value below is public configuration.
on:
  workflow_dispatch:

jobs:
  apk:
    name: Build the Android APK
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in a step's `if`; this flag can.
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use the npm the lockfiles were written with
        run: npm install -g npm@11

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the core
        run: |
          cd core
          npm ci
          npm run build

      - name: Install the app
        run: |
          cd mobile
          npm ci

      - name: Create the app .env (public values)
        run: |
          cat > mobile/.env << EOF
          EXPO_PUBLIC_API_URL=https://api.seainvaders.xyz
          EXPO_PUBLIC_RPC_URL=https://api.devnet.solana.com
          EXPO_PUBLIC_SOLANA_CLUSTER=devnet
          EOF

      # The release keystore comes from repository secrets (see backend/DEPLOYMENT.md, "Release
      # signing"); without them the build keeps the template's debug key, so a fork still builds.
      - name: Prepare the release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SEA_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SEA_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SEA_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SEA_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "release keystore ready ($(stat -c %s "$RUNNER_TEMP/release.jks") bytes)"

      - name: Generate the Android project
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install
          echo "release signing in app/build.gradle:"
          grep -n "signingConfigs.release\|signingConfigs.debug" android/app/build.gradle || true

      - name: Assemble the release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # The certificate fingerprint is public (it is what /.well-known/assetlinks.json on
      # seainvaders.xyz lists); printing it proves which key signed this build.
      - name: Print the signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs mobile/android/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256\|Signer #1 certificate DN"

      - name: Keep the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: sea-invaders-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy the APK to the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /root/apk'
          scp -P "$SSH_PORT" mobile/android/app/build/outputs/apk/release/app-release.apk "$SSH_USER@$SSH_HOST:/root/apk/sea-invaders-$SHORT_SHA.apk"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cp /root/apk/sea-invaders-$SHORT_SHA.apk /root/apk/latest.apk"
