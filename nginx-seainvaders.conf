# Nginx configuration for seainvaders.fun
# Copy to the server: /etc/nginx/sites-available/seainvaders.fun

# Upstream for the Next.js frontend
upstream nextjs_frontend {
    server 127.0.0.1:5437;
    keepalive 64;
}

# Upstream for the Express backend
upstream express_backend {
    server 127.0.0.1:5438;
    keepalive 64;
}

# HTTP configuration (Cloudflare proxy mode)
server {
    listen 80;
    listen [::]:80;
    server_name seainvaders.fun www.seainvaders.fun;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Frontend
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
        proxy_pass http://express_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://express_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
