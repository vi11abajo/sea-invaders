<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>on withandinandand - sea invaders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1654 50%, #4a1b6e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

 /* andwithtoand new */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255, 140, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(148, 0, 211, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 69, 0, 0.05) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 800px;
        }

        h1 {
            color: #ff8c00;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow:
                0 0 10px rgba(255, 140, 0, 0.8),
                0 0 20px rgba(255, 140, 0, 0.6),
                0 0 30px rgba(255, 140, 0, 0.4),
                3px 3px 6px rgba(0, 0, 0, 0.8);
            animation: glow 2s ease-in-out infinite;
            font-weight: bold;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow:
                    0 0 10px rgba(255, 140, 0, 0.8),
                    0 0 20px rgba(255, 140, 0, 0.6),
                    0 0 30px rgba(255, 140, 0, 0.4),
                    3px 3px 6px rgba(0, 0, 0, 0.8);
            }
            50% {
                text-shadow:
                    0 0 20px rgba(255, 140, 0, 1),
                    0 0 30px rgba(255, 140, 0, 0.8),
                    0 0 40px rgba(255, 140, 0, 0.6),
                    3px 3px 6px rgba(0, 0, 0, 0.8);
            }
        }

        .subtitle {
            color: #ffa500;
            font-size: 1.5rem;
            margin-bottom: 40px;
            text-shadow:
                0 0 5px rgba(255, 165, 0, 0.6),
                2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .image-container {
            margin: 40px auto;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .cooking-image {
            max-width: 400px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(255, 140, 0, 0.6));
        }

        .dots {
            display: inline-block;
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        .twitter-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #1DA1F2 0%, #0d8bd9 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 161, 242, 0.4);
        }

        .twitter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(29, 161, 242, 0.6);
            background: linear-gradient(135deg, #0d8bd9 0%, #1DA1F2 100%);
        }

        .twitter-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .footer {
            position: fixed;
            bottom: 20px;
            color: #ff8c00;
            font-size: 0.9rem;
            opacity: 0.8;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 2;
        }

 /* andon yesand */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .cooking-image {
                max-width: 300px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .cooking-image {
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>UNDER MAINTENANCE</h1>
        <p class="subtitle">We're cooking something special<span class="dots">...</span></p>

        <div class="image-container">
            <img src="COOKING.png" alt="Cooking" class="cooking-image">
        </div>

        <a href="https://twitter.com/vi11abajo" target="_blank" class="twitter-button">
            <svg class="twitter-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            Follow @vi11abajo
        </a>
    </div>

    <div class="footer">
        sea invaders | we'll be back soon
    </div>

    <script>
        //animation to
        setInterval(() => {
            const dots = document.querySelector('.dots');
            const current = dots.textContent.length;
            dots.textContent = '.'.repeat((current % 3) + 1);
        }, 500);
    </script>
</body>
</html>
